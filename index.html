function quiz(){let q=questions[question];return top()+'<h2>Wissenstest</h2><p class="muted">Frage '+(question+1)+' von '+questions.length+'</p><div class="panel"><div class="panel-content"><h3>'+e(q.q)+'</h3>'+q.a.map((v,i)=>'<button class="quiz-option '+(answer===null?'':i===q.right?'correct':i===answer?'wrong':'')+'" data-answer="'+i+'">'+String.fromCharCode(65+i)+': '+e(v)+'</button>').join("")+(answer===null?'':'<div class="tip">'+(answer===q.right?'✓ Richtig! ':'Noch nicht ganz. ')+e(q.why)+'</div><button class="favorite" data-next="1">Nächste Frage →</button>')+'</div></div>'}
function knowledge(){return top()+'<h2>Wissen</h2><div class="panel"><div class="panel-heading">Gespräche wirksam führen</div><div class="panel-content"><p>Gute Gesprächsführung verbindet Klarheit, Wertschätzung und echtes Interesse.</p><ol><li>Gesprächsziel klären</li><li>Aktiv zuhören und nachfragen</li><li>Beobachtungen von Bewertungen trennen</li><li>Gemeinsam nächste Schritte vereinbaren</li></ol></div></div><div class="tip">💡 Tipp: Öffne vor einem schwierigen Gespräch den passenden Leitfaden.</div>'}
function render(){document.getElementById("app").innerHTML=screen==="home"?home():screen==="category"?categoryView():screen==="detail"?detail():screen==="guides"?guides():screen==="favorites"?favorites():screen==="quiz"?quiz():knowledge();const tabs=[["home","⌂","Übersicht"],["favorites","♡","Favoriten"],["guides","▣","Leitfäden"],["quiz","◇","Quiz"],["knowledge","ⓘ","Wissen"]];document.getElementById("bottom").innerHTML=tabs.map(t=>'<button data-go="'+t[0]+'" class="'+(screen===t[0]?"active":"")+'"><span>'+t[1]+'</span>'+t[2]+'</button>').join("");document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{screen=b.dataset.go;render();scrollTo(0,0)});document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{category=b.dataset.cat;screen="category";render();scrollTo(0,0)});document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.item);screen="detail";render();scrollTo(0,0)});document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{let i=Number(b.dataset.fav);fav=fav.includes(i)?fav.filter(v=>v!==i):[...fav,i];try{localStorage.setItem("test5-fav",JSON.stringify(fav))}catch(e){}render()});document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{if(answer===null){answer=Number(b.dataset.answer);render()}});document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{question=(question+1)%questions.length;answer=null;render()});const s=document.getElementById("search");if(s){s.oninput=()=>{query=s.value;let rows=data.filter(x=>x.flat().join(" ").toLocaleLowerCase("de").includes(query.toLocaleLowerCase("de")));document.getElementById("searchresults").innerHTML=query.trim()?'<div class="panel">'+(rows.length?rows.map(itemRow).join(""):'<div class="empty">Keine Treffer</div>')+'</div>':'';document.querySelectorAll("#searchresults [data-item]").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.item);category=null;screen="detail";render();scrollTo(0,0)})};if(query)s.oninput()}}
render();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
